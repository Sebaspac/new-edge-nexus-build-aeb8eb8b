# NEWEDGE — nginx-Konfiguration (Same-Origin-Setup)
# ------------------------------------------------------------------
# Eine Domain für alles: statische Website + CMS-Pfade auf Strapi.
# Spiegelt exakt das Dev-Proxy-Mapping aus vite.config.ts der Website.
# Datei nach /etc/nginx/sites-available/newedgebrand.conf, dann:
#   ln -s ../sites-available/newedgebrand.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# TLS danach via: certbot --nginx -d newedgebrand.com -d www.newedgebrand.com
# ------------------------------------------------------------------

# Strapi-Upstream (docker-compose bindet an 127.0.0.1:1337)
upstream strapi {
    server 127.0.0.1:1337;
}

server {
    listen 80;
    listen [::]:80;
    server_name newedgebrand.com www.newedgebrand.com;

    # ── Statische Website (Vite-Build) ──────────────────────────────
    root /var/www/newedgebrand/dist;
    index index.html;

    # Upload-Limit für CMS-Medien
    client_max_body_size 64m;

    # Gehashte Assets aggressiv cachen
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-Fallback: alle Routen auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── CMS-Pfade → Strapi (identisch zum Vite-Dev-Proxy) ───────────
    location ~ ^/(api|uploads|upload|admin|content-manager|content-type-builder|users-permissions|i18n|_health) {
        proxy_pass http://strapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Optional: Admin-Panel zusätzlich absichern (IP-Allowlist o. Basic-Auth).
    # location /admin {
    #     allow 203.0.113.10;   # Büro-IP
    #     deny all;
    #     proxy_pass http://strapi;
    #     ... (Header wie oben)
    # }
}
