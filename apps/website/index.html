    <!-- Google Tag Manager & GA4 — Consent-Gate (DSGVO/TTDSG)
         Vor der Einwilligung im Cookie-Banner geht KEINE Anfrage an Google.
         Die Skripte werden erst nachgeladen, wenn der Nutzer Statistik- oder
         Marketing-Cookies akzeptiert hat; Consent Mode v2 steht bis dahin auf
         "denied". Der Banner (src/components/CookieConsent.tsx) schreibt die
         Auswahl nach localStorage und feuert 'cookie-consent-changed'. -->
    <script>
      (function () {
        var GTM_ID = 'GTM-5LPQ2DT7';
        var GA_ID = 'G-9JCE208Q8L';
        var injected = false;

        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;

        // Consent Mode v2: Standard ist Ablehnung — gilt auch für alles,
        // was später über den GTM-Container nachgeladen wird.
        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'denied',
          functionality_storage: 'granted',
          security_storage: 'granted'
        });

        function readConsent() {
          try {
            var raw = window.localStorage.getItem('cookie-consent');
            return raw ? JSON.parse(raw).preferences : null;
          } catch (e) { return null; }
        }

        function injectGoogle() {
          if (injected) return;
          injected = true;
          window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var gtm = document.createElement('script');
          gtm.async = true;
          gtm.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM_ID;
          document.head.appendChild(gtm);

          var ga = document.createElement('script');
          ga.async = true;
          ga.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(ga);
          gtag('js', new Date());
          gtag('config', GA_ID);
        }

        function apply(prefs) {
          if (!prefs) return;
          gtag('consent', 'update', {
            ad_storage: prefs.marketing ? 'granted' : 'denied',
            ad_user_data: prefs.marketing ? 'granted' : 'denied',
            ad_personalization: prefs.marketing ? 'granted' : 'denied',
            analytics_storage: prefs.analytics ? 'granted' : 'denied'
          });
          if (prefs.analytics || prefs.marketing) injectGoogle();
        }

        apply(readConsent());
        window.addEventListener('cookie-consent-changed', function (e) { apply(e.detail); });
      })();
    </script>
